<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="bathurstSky" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#17191c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="conrodRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#17191c"/>
  <rect width="1200" height="900" fill="url(#bathurstSky)"/>
  
  <!-- Mountain descent skyline -->
  <path d="M 0 450 Q 300 380 650 480 T 1200 420 L 1200 900 L 0 900 Z" fill="url(#conrodRoad)"/>
  
  <!-- Motion streaks down Conrod Straight -->
  <g transform="skewX(-20)">
    <line x1="200" y1="520" x2="1100" y2="520" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.8"/>
    <line x1="100" y1="550" x2="1200" y2="550" stroke="#ef4444" stroke-width="12" stroke-opacity="0.7"/>
    <line x1="350" y1="590" x2="1300" y2="590" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.9"/>
  </g>
  
  <!-- V8 Supercar touring silhouette -->
  <path d="M 420 500 C 500 440, 750 440, 880 500 L 920 550 L 380 550 Z" fill="#0c0d10" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="500" cy="550" r="38" fill="#08080a" stroke="#858990" stroke-width="3"/>
  <circle cx="820" cy="550" r="38" fill="#08080a" stroke="#858990" stroke-width="3"/>
  
  <text x="50" y="840" fill="#858990" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="2">BATHURST CONROD DESCENT · 1/50S</text>
</svg>