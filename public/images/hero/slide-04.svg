<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="brakeGlow" cx="65%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#17191c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kerbGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#1f2228"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#17191c"/>
  <rect width="1600" height="1000" fill="url(#kerbGrad)"/>
  <rect width="1600" height="1000" fill="url(#brakeGlow)"/>
  
  <!-- Sweeping red and white ripple kerb -->
  <g transform="rotate(-14 800 600)">
    <path d="M 0 540 Q 600 500 1600 580" fill="none" stroke="#ef4444" stroke-width="36" stroke-dasharray="80 80"/>
    <path d="M 0 540 Q 600 500 1600 580" fill="none" stroke="#f4f4f5" stroke-width="36" stroke-dasharray="80 80" stroke-dashoffset="80"/>
  </g>
  
  <!-- Speed blur arcs -->
  <path d="M 550 480 Q 950 430 1450 510" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="4"/>
  <path d="M 620 510 Q 1000 460 1500 530" fill="none" stroke="#f97316" stroke-opacity="0.5" stroke-width="6"/>
  <path d="M 680 530 Q 1050 490 1520 560" fill="none" stroke="#ef4444" stroke-opacity="0.7" stroke-width="8"/>
  
  <!-- Glowing carbon ceramic brake rotor behind wheel spokes -->
  <circle cx="1020" cy="530" r="42" fill="#ea580c" filter="drop-shadow(0 0 16px #ea580c)"/>
  <circle cx="1020" cy="530" r="26" fill="#17191c"/>
  
  <!-- Subtle Metadata overlay -->
  <text x="110" y="930" fill="#858990" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="3">04 // CHICANE KERB DYNAMICS · 135MM F/2.0 · 1/250S</text>
</svg>